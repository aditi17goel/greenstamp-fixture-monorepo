name: ci

on:
  push:
  pull_request:
  # Inert until a merge queue is enabled on this repo; required for the
  # merge-queue measurement leg (no queue exists yet).
  merge_group:

permissions:
  contents: read
  pull-requests: write # skip-receipt comments from the decide step

jobs:
  test-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          fetch-depth: 0

      # Path filter: this job's tests run only when alpha's paths changed.
      # PRs diff against the base SHA; push/merge_group diff against HEAD~1
      # (approximate for merge-group temp commits; the filter is fixture
      # realism, and the measurement plan records the caveat). The root
      # commit has no parent, so it counts as changed.
      - id: paths
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="HEAD~1"
          if ! git rev-parse "$base" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- pkgs/alpha tests/test_alpha.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ids
        if: steps.paths.outputs.changed == 'true'
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "wf=$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Same gate pattern as greenstamp's own ci workflow: the secrets
      # context is unusable in step `if:` expressions, so detect
      # configuration in shell once and gate on this step's output.
      # Secrets arrive via env indirection, never interpolated. Inert
      # (plain pytest runs) until all four secrets exist.
      - id: gate
        if: steps.paths.outputs.changed == 'true'
        env:
          API_URL: ${{ secrets.GREENSTAMP_API_URL }}
          API_TOKEN: ${{ secrets.GREENSTAMP_API_TOKEN }}
          RECORD_TOKEN: ${{ secrets.GREENSTAMP_RECORD_TOKEN }}
          CHECKOUT_TOKEN: ${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$API_TOKEN" ] && [ -n "$RECORD_TOKEN" ] && [ -n "$CHECKOUT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # The greenstamp action lives in the private greenstamp repo, which this
      # workflow cannot `uses:` directly (GitHub runs actions only from the
      # same or a public repository), so check it out at a pinned SHA.
      # Re-pin deliberately; the SHA is part of the measurement record.
      - if: steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          repository: aditi17goel/greenstamp
          ref: 52f0314131faab12c109a432c87bbda49950010a
          token: ${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}
          path: .greenstamp-action
          persist-credentials: false

      # Skip when this exact package already passed on this tree. The pkg
      # input keeps alpha and beta distinct job identities.
      - id: dedupe
        if: steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          mode: decide
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"pkg":"alpha"}'
          tool-versions-json: '{"python":"3.12"}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - id: timer_start
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        with:
          python-version: "3.12"

      - run: pip install "pytest==9.1.1"
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'

      - run: pytest tests/test_alpha.py -q
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'

      - id: timer_stop
        if: always() && steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        env:
          TIMER_START: ${{ steps.timer_start.outputs.start }}
        run: |
          end=$(date +%s)
          start="$TIMER_START"
          echo "duration=$((end - ${start:-$end}))" >> "$GITHUB_OUTPUT"

      # Recording happens in trusted contexts only (pushes, never PR
      # builds): the record credential must not reach untrusted code.
      - if: always() && steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true' && steps.dedupe.outputs.verdict != 'skip' && github.event_name != 'pull_request'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          record-token: ${{ secrets.GREENSTAMP_RECORD_TOKEN }}
          mode: record
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"pkg":"alpha"}'
          tool-versions-json: '{"python":"3.12"}'
          commit-sha: ${{ github.sha }}
          passed: ${{ job.status == 'success' }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          duration-s: ${{ steps.timer_stop.outputs.duration }}

  test-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          fetch-depth: 0

      - id: paths
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="HEAD~1"
          if ! git rev-parse "$base" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- pkgs/beta tests/test_beta.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ids
        if: steps.paths.outputs.changed == 'true'
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "wf=$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: gate
        if: steps.paths.outputs.changed == 'true'
        env:
          API_URL: ${{ secrets.GREENSTAMP_API_URL }}
          API_TOKEN: ${{ secrets.GREENSTAMP_API_TOKEN }}
          RECORD_TOKEN: ${{ secrets.GREENSTAMP_RECORD_TOKEN }}
          CHECKOUT_TOKEN: ${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$API_TOKEN" ] && [ -n "$RECORD_TOKEN" ] && [ -n "$CHECKOUT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          repository: aditi17goel/greenstamp
          ref: 52f0314131faab12c109a432c87bbda49950010a
          token: ${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}
          path: .greenstamp-action
          persist-credentials: false

      - id: dedupe
        if: steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          mode: decide
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"pkg":"beta"}'
          tool-versions-json: '{"python":"3.12"}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - id: timer_start
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        with:
          python-version: "3.12"

      - run: pip install "pytest==9.1.1"
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'

      - run: pytest tests/test_beta.py -q
        if: steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'

      - id: timer_stop
        if: always() && steps.paths.outputs.changed == 'true' && steps.dedupe.outputs.verdict != 'skip'
        env:
          TIMER_START: ${{ steps.timer_start.outputs.start }}
        run: |
          end=$(date +%s)
          start="$TIMER_START"
          echo "duration=$((end - ${start:-$end}))" >> "$GITHUB_OUTPUT"

      # Recording happens in trusted contexts only (pushes, never PR
      # builds): the record credential must not reach untrusted code.
      - if: always() && steps.paths.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true' && steps.dedupe.outputs.verdict != 'skip' && github.event_name != 'pull_request'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          record-token: ${{ secrets.GREENSTAMP_RECORD_TOKEN }}
          mode: record
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"pkg":"beta"}'
          tool-versions-json: '{"python":"3.12"}'
          commit-sha: ${{ github.sha }}
          passed: ${{ job.status == 'success' }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          duration-s: ${{ steps.timer_stop.outputs.duration }}
